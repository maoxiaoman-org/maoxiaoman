name: 问题反馈 / Bug report
description: 报告贸小满使用中遇到的问题
title: "[问题] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请勿提交真实客户、报价、单据、银行资料、账号凭据或未打码截图。公开 Issue 可被所有人查看。
  - type: input
    id: area
    attributes:
      label: 页面或功能
      placeholder: 例如：报价单编辑、PDF 导出
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: 使用示例数据描述操作步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 浏览器与系统
      placeholder: 例如：Chrome 版本、Windows 11
